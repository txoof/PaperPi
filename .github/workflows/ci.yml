name: CI

# CI is skipped when a change only touches documentation or GitHub templates.
# The list is written once (&docs-only) and reused for the push trigger (*docs-only).
# Note: if CI checks are ever made *required* in branch protection, docs-only PRs
# would wait forever for a check that never runs; handle that before turning it on.
on:
  pull_request:
    paths-ignore: &docs-only
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
  push:
    branches: [main]
    paths-ignore: *docs-only

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Run tests
        run: uv run pytest --html=reports/test-report.html --self-contained-html
      - name: Upload test report
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: reports/test-report.html
          if-no-files-found: error
      - name: Link the report on the run summary page
        if: always() && steps.upload.outputs.artifact-url != ''
        run: |
          echo "### Test report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the HTML test report](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
