# The PaperPi manual: a website made from docs/ by MkDocs with the Material theme.
# Build it with: uv run --group docs mkdocs serve (see docs/development.md, "The manual").
# .github/workflows/docs.yml builds it for every PR and publishes it on every merge to main.
site_name: PaperPi
site_description: Show information on e-paper displays attached to a Raspberry Pi
site_url: https://txoof.github.io/PaperPi/
repo_url: https://github.com/txoof/PaperPi
repo_name: txoof/PaperPi
edit_uri: edit/main/docs/
copyright: PaperPi is free software under the GPL 3.0 or later.

theme:
  name: material
  favicon: images/paperpi-icon.svg
  logo: images/paperpi-icon.svg
  palette:
    # Follows the device's light or dark setting; the button switches by hand.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - content.code.copy
    # The menu shows the main headings; each one folds open to show its pages.
    # A section's first page (Plugins) opens from the heading itself.
    - navigation.indexes
    # Previous and Next links at the bottom of every page, in menu order.
    - navigation.footer
    - navigation.top
    - search.suggest

# Adds the pages made from the code: settings, screens, plugins (see mkdocs_hooks.py).
# Notes for the people and agents working on PaperPi: in the repository, not on the site.
exclude_docs: |
  history/
  v1-inventory.md
  it8951-test-report.md
  images/it8951-endurance.svg

hooks:
  - mkdocs_hooks.py

# Small changes to the theme's look (see the comments in the file).
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  # Lets Markdown be used inside HTML blocks, such as the picture grid on the home page.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# A link to a page that does not exist stops the build (the docs workflow uses --strict).
validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Hardware: hardware.md
      - Install: install.md
      - First Setup: first-setup.md
      - Web Interface: web-interface.md
      - Update and Uninstall: update.md
      - Understanding Plugin Schedules: take-turns.md
      - Troubleshooting: troubleshooting.md
      - What's New: changelog.md
  - Plugins:
      - plugins/index.md
  - Reference:
      - Settings reference: settings.md
      - Supported screens: screens.md
      - How the service works: install-systemd.md
  - For developers:
      - Running from source: development.md
      - Writing a plugin: writing-plugins.md
      - Plugin reference: plugin-reference.md
      - Making a release: releasing.md
      - How PaperPi works:
          - The config file: specs/config.md
          - Which plugin is shown: specs/scheduling.md
          - Plugins and setting helpers: specs/plugins.md
