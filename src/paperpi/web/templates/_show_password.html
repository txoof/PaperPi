{#- A password field with a Show button next to it, which shows what was typed (and hides
    it again; static/password.js). The button stays hidden without JavaScript. -#}
{% macro password_field(id, autocomplete, minlength=0, autofocus=false) -%}
<span class="pw"><input type="password" id="{{ id }}" name="{{ id }}" autocomplete="{{ autocomplete }}"
  {%- if minlength %} minlength="{{ minlength }}"{% endif %} required{% if autofocus %} autofocus{% endif %}>
  <button class="quiet" type="button" data-show="{{ id }}" aria-pressed="false" hidden>Show</button></span>
{%- endmacro %}
