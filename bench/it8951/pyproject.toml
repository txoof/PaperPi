[project]
name = "it8951bench"
version = "0.0.0"
description = "M2 test round: measure IT8951 driver candidates on the 9.7 inch display. Not part of PaperPi."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["it8951bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["it8951bench"]
