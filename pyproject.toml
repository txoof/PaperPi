[project]
name = "paperpi"
version = "2.0.0.dev0"
description = "Show information on e-paper displays attached to a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "epdlib[it8951]",
    "pydantic>=2.9",
    "tomlkit>=0.13",
]

[project.scripts]
paperpi = "paperpi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-html>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a real display attached; run only on the Pi with `uv run pytest -m hardware`",
]
addopts = "--strict-markers -m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# epdlib is not on PyPI yet, so it comes from GitHub at one fixed commit (see CLAUDE.md).
# Move `rev` forward when PaperPi needs a newer epdlib.
[tool.uv.sources]
epdlib = { git = "https://github.com/txoof/epdlib", rev = "f3092caf840d8136030b0a7739a01fb2db0d7bdf" }
